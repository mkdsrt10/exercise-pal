# Runs Exercise Pal and its object storage on one machine (e.g. a Mac Studio).
# Both services listen on localhost only; Tailscale exposes the app over HTTPS.
#   cp .env.example .env   # fill in keys
#   docker compose up -d --build
#   tailscale serve --bg 3000

services:
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    image: exercise-pal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: exercise-pal-web
    env_file: .env
    environment:
      S3_ENDPOINT: http://minio:9000
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
